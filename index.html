<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Lurbel × Like Sport</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #E2001A;
    --red-dark: #B3191A;
    --black: #1A1A1A;
    --grey-mid: #C8C7C5;
    --white: #FFFFFF;
  }

  html, body {
    height: 100%;
    font-family: 'Barlow', sans-serif;
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 64px;
    background: rgba(26,26,26,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
  }
  header img { height: 28px; }
  .header-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--grey-mid);
  }

  /* ── SCREENS ── */
  .screen { display: none; min-height: 100vh; padding-top: 64px; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── SCREEN 1: FORM ── */
  #screen-form { position: relative; align-items: center; justify-content: center; }

  .hero-bg {
    position: fixed; inset: 0;
    background: url('https://lurbel.eu/uploads/lurbel-spring-summer-26.jpg') center/cover no-repeat;
    z-index: 0;
  }
  .hero-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, rgba(26,26,26,0.88) 0%, rgba(226,0,26,0.18) 100%);
    z-index: 1;
  }
  .form-container {
    position: relative; z-index: 2;
    width: 100%; max-width: 480px;
    margin: 40px 16px;
    background: rgba(26,26,26,0.82);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(16px);
    padding: 40px 36px;
  }
  .form-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--red); margin-bottom: 12px;
  }
  .form-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 42px; font-weight: 800;
    line-height: 1.0; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .form-title span { color: var(--red); }
  .form-subtitle { font-size: 14px; color: var(--grey-mid); line-height: 1.5; margin-bottom: 32px; }

  .form-row { display: flex; gap: 12px; }
  .form-group { display: flex; flex-direction: column; flex: 1; margin-bottom: 16px; }

  label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--grey-mid); margin-bottom: 6px;
  }
  input[type="text"], input[type="email"] {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--white);
    font-family: 'Barlow', sans-serif; font-size: 15px;
    padding: 12px 14px; outline: none;
    transition: border-color 0.2s; width: 100%;
  }
  input:focus { border-color: var(--red); }
  input::placeholder { color: rgba(255,255,255,0.25); }

  .checkbox-group {
    display: flex; align-items: flex-start;
    gap: 12px; margin-bottom: 28px; cursor: pointer;
  }
  .checkbox-group input[type="checkbox"] {
    width: 18px; height: 18px; min-width: 18px;
    accent-color: var(--red); cursor: pointer; margin-top: 2px;
  }
  .checkbox-group span { font-size: 12px; color: var(--grey-mid); line-height: 1.5; }
  .checkbox-group a { color: var(--grey-mid); text-decoration: underline; }

  .btn-primary {
    width: 100%; background: var(--red); color: var(--white);
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 16px 24px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { background: #555; cursor: not-allowed; }

  .error-msg {
    display: none;
    background: rgba(226,0,26,0.15);
    border: 1px solid var(--red);
    color: #ff6b6b; font-size: 13px;
    padding: 12px 14px; margin-bottom: 16px;
  }

  /* ── SCREEN 2: WHEEL ── */
  #screen-wheel {
    align-items: center; justify-content: center;
    background: var(--black); padding: 40px 16px;
    min-height: 100vh;
  }
  .wheel-section {
    display: flex; flex-direction: column;
    align-items: center; gap: 28px;
    width: 100%; max-width: 560px;
  }
  .wheel-heading { text-align: center; }
  .wheel-heading .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--red); margin-bottom: 8px;
  }
  .wheel-heading h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.02em;
  }

  .wheel-wrapper {
    position: relative;
    width: 480px; height: 480px;
  }
  #wheel-canvas {
    border-radius: 50%;
    box-shadow: 0 0 0 6px var(--black), 0 0 0 10px rgba(226,0,26,0.35), 0 24px 60px rgba(0,0,0,0.7);
    display: block;
  }
  .wheel-pointer {
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 32px solid var(--red);
    filter: drop-shadow(0 2px 8px rgba(226,0,26,0.8));
    z-index: 10;
  }
  .wheel-center-cap {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 64px; height: 64px;
    background: var(--black);
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    box-shadow: 0 0 0 2px rgba(226,0,26,0.3);
  }
  .wheel-center-cap svg { width: 36px; height: 36px; }

  /* Try Again toast */
  .try-again-toast {
    display: none;
    background: rgba(226,0,26,0.12);
    border: 1px solid rgba(226,0,26,0.4);
    padding: 14px 20px;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }
  .try-again-toast.visible { display: block; }
  .try-again-toast p {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--white);
  }
  .try-again-toast span { color: var(--red); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .btn-spin {
    background: var(--red); color: var(--white);
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 18px 64px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-spin:hover { background: var(--red-dark); }
  .btn-spin:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }

  /* ── SCREEN 3: RESULT ── */
  #screen-result {
    align-items: center; justify-content: center;
    background: var(--black); padding: 80px 16px 40px;
  }
  .result-card { width: 100%; max-width: 460px; text-align: center; }
  .result-icon {
    width: 80px; height: 80px;
    margin: 0 auto 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
  }
  .result-icon.win { background: rgba(226,0,26,0.15); border: 2px solid var(--red); }
  .result-icon.loss { background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15); }

  .result-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--red); margin-bottom: 12px;
  }
  .result-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 44px; font-weight: 800;
    text-transform: uppercase; line-height: 1.0; margin-bottom: 16px;
  }
  .result-body {
    font-size: 15px; color: var(--grey-mid); line-height: 1.6;
    margin-bottom: 32px; max-width: 360px; margin-left: auto; margin-right: auto;
  }
  .result-prize-box {
    background: rgba(226,0,26,0.1);
    border: 1px solid rgba(226,0,26,0.3);
    padding: 20px 24px; margin-bottom: 32px;
  }
  .result-prize-box .prize-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--red); margin-bottom: 6px;
  }
  .result-prize-box .prize-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px; font-weight: 800;
    text-transform: uppercase; color: var(--white);
  }
  .result-note { font-size: 12px; color: rgba(255,255,255,0.35); line-height: 1.5; }

  /* ── LOADING ── */
  .loading-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(26,26,26,0.85); z-index: 200;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--grey-mid);
  }

  @media (max-width: 560px) {
    .form-container { padding: 28px 20px; margin: 24px 12px; }
    .form-title { font-size: 32px; }
    .form-row { flex-direction: column; gap: 0; }
    .wheel-wrapper { width: 320px; height: 320px; }
    #wheel-canvas { width: 320px !important; height: 320px !important; }
    .wheel-center-cap { width: 44px; height: 44px; }
    .wheel-center-cap svg { width: 24px; height: 24px; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Comprobando participación…</div>
</div>

<!-- HEADER -->
<header>
  <img src="https://lurbel.eu/uploads/logo-lurbel-white.svg" alt="Lurbel" onerror="this.style.display='none'">
  <span class="header-tag">Lurbel × Like Sport</span>
</header>

<!-- SCREEN 1: FORM -->
<div class="screen active" id="screen-form">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="form-container">
    <div class="form-eyebrow">Lurbel × Like Sport</div>
    <h1 class="form-title">Gira la ruleta<br><span>y gana</span></h1>
    <p class="form-subtitle">Rellena tus datos y prueba suerte. Hay premios Lurbel esperándote.</p>

    <div class="error-msg" id="error-msg"></div>

    <div class="form-row">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="given-name">
      </div>
      <div class="form-group">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" placeholder="Tus apellidos" autocomplete="family-name">
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="ciudad">Ciudad</label>
      <input type="text" id="ciudad" placeholder="Tu ciudad" autocomplete="address-level2">
    </div>

    <label class="checkbox-group" for="lopd">
      <input type="checkbox" id="lopd">
      <span>He leído y acepto la <a href="https://lurbel.eu/politica-de-privacidad" target="_blank">política de privacidad</a> de MLS Textiles 1992 S.L. y consiento el tratamiento de mis datos personales para la gestión de esta promoción.</span>
    </label>

    <button class="btn-primary" id="btn-form" onclick="submitForm()">
      <span>Girar la ruleta</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<!-- SCREEN 2: WHEEL -->
<div class="screen" id="screen-wheel">
  <div class="wheel-section">
    <div class="wheel-heading">
      <div class="eyebrow">Tu turno</div>
      <h2 id="wheel-title">¡Gira y descubre tu premio!</h2>
    </div>

    <div class="try-again-toast" id="try-again-toast">
      <p>🔄 ¡<span>Try Again!</span> Vuelve a girar la ruleta</p>
    </div>

    <div class="wheel-wrapper">
      <div class="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="480" height="480"></canvas>
      <div class="wheel-center-cap">
        <!-- Lurbel imagotip SVG inline -->
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 8C27 8 8 27 8 50s19 42 42 42 42-19 42-42S73 8 50 8z" fill="none"/>
          <!-- Lurbel swoosh symbol based on the imagotip -->
          <path d="M62 18c-8-4-18-4-26 0C24 24 16 34 16 46c0 8 3 15 8 20 2 2 5 1 5-2V42c0-10 8-18 18-18 4 0 8 1 11 3 5 3 8 9 8 15v6c0 3 3 5 5 3 5-5 8-12 8-19 0-6-2-11-6-15-3-3-7-6-11-7z" fill="white"/>
          <path d="M29 70c-2-2-5-1-5 2 4 7 11 12 19 13 9 2 18-1 24-7 2-2 1-5-1-6-7-3-13-8-16-15-1-2-4-2-5 0-3 5-8 10-14 13H29z" fill="white" opacity="0.85"/>
        </svg>
      </div>
    </div>

    <button class="btn-spin" id="btn-spin" onclick="spinWheel()">¡Girar!</button>
  </div>
</div>

<!-- SCREEN 3: RESULT -->
<div class="screen" id="screen-result">
  <div class="result-card">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-eyebrow" id="result-eyebrow"></div>
    <h2 class="result-title" id="result-title"></h2>
    <p class="result-body" id="result-body"></p>
    <div class="result-prize-box" id="result-prize-box" style="display:none">
      <div class="prize-label">Tu premio</div>
      <div class="prize-name" id="result-prize-name"></div>
    </div>
    <p class="result-note" id="result-note"></p>
  </div>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxWc6mZtAgUN2hDMcxBQ4UEfPQxCVAbwehH8gWocs_RU75p8Qi8NhBeE7vW9J7dPeoFfg/exec';

// ── SECTORS — 11 caselles: 4 BL + 4 TA + 1 DC + 1 G + 1 LP ─────────────────
// Alternant roig/gris, seguint el disseny del PDF
var SECTORS = [
  { label: 'Better Luck\nNext Time!', color: '#E2001A', id: 'better_luck' },
  { label: 'Discount\nCoupon',        color: '#D9D8D6', id: 'discount'    },
  { label: 'Better Luck\nNext Time!', color: '#E2001A', id: 'better_luck' },
  { label: 'Try Again',               color: '#D9D8D6', id: 'try_again'   },
  { label: 'Better Luck\nNext Time!', color: '#E2001A', id: 'better_luck' },
  { label: 'Gift',                    color: '#D9D8D6', id: 'gift'        },
  { label: 'Try Again',               color: '#E2001A', id: 'try_again'   },
  { label: 'Lurbel Pack',             color: '#D9D8D6', id: 'lurbel_pack' },
  { label: 'Try Again',               color: '#E2001A', id: 'try_again'   },
  { label: 'Better Luck\nNext Time!', color: '#D9D8D6', id: 'better_luck' },
  { label: 'Try Again',               color: '#E2001A', id: 'try_again'   },
];
// 4 better_luck + 4 try_again + 1 discount + 1 gift + 1 lurbel_pack = 11

// Pool FINAL (sense Try Again): per nova tirada després de Try Again
var FINAL_POOL = [
  'Better Luck Next Time!','Better Luck Next Time!','Better Luck Next Time!','Better Luck Next Time!',
  'Discount Coupon','Gift','Lurbel Pack'
];

// Pool INICIAL: per fallback local si el servidor no respon
var FULL_POOL = [
  'Better Luck Next Time!','Better Luck Next Time!','Better Luck Next Time!','Better Luck Next Time!',
  'Try Again','Try Again','Try Again','Try Again',
  'Discount Coupon','Gift','Lurbel Pack'
];

// Mapa premi → id de sector
var PRIZE_TO_SECTOR = {
  'Lurbel Pack':            'lurbel_pack',
  'Gift':                   'gift',
  'Discount Coupon':        'discount',
  'Try Again':              'try_again',
  'Better Luck Next Time!': 'better_luck'
};

// ── RESULTATS ────────────────────────────────────────────────────────────────
var PRIZE_INFO = {
  'Lurbel Pack': {
    win:     true,
    eyebrow: '¡Enhorabuena!',
    title:   '¡Has ganado el<br>Lurbel Pack!',
    body:    '¡Este es el premio más especial de la ruleta! El equipo de Like Sport se pondrá en contacto contigo para gestionar la entrega.',
    note:    'Muestra esta pantalla en tienda.',
    icon:    '🎉'
  },
  'Gift': {
    win:     true,
    eyebrow: '¡Enhorabuena!',
    title:   '¡Has ganado un<br>regalo sorpresa!',
    body:    'Pasa por el mostrador de Like Sport y recoge tu regalo sorpresa Lurbel.',
    note:    'Muestra esta pantalla en tienda.',
    icon:    '🎁'
  },
  'Discount Coupon': {
    win:     true,
    eyebrow: '¡Enhorabuena!',
    title:   '¡Has ganado un<br>cupón descuento!',
    body:    'Pasa por Like Sport y disfruta de tu descuento exclusivo en productos Lurbel.',
    note:    'Muestra esta pantalla en tienda.',
    icon:    '🎟'
  },
  'Better Luck Next Time!': {
    win:     false,
    eyebrow: 'Sin suerte esta vez',
    title:   'Mejor suerte<br>la próxima',
    body:    '¡Gracias por participar!',
    note:    '',
    icon:    '😅'
  }
};

// ── STATE ────────────────────────────────────────────────────────────────────
var userData    = {};
var serverPrize = null;  // premi que ha de mostrar la ruleta en AQUESTA tirada
var spinning    = false;
var spinAngle   = 0;

// ── CANVAS ───────────────────────────────────────────────────────────────────
var canvas = document.getElementById('wheel-canvas');
var ctx    = canvas.getContext('2d');
var N      = SECTORS.length;
var ARC    = (2 * Math.PI) / N;

function drawWheel(angle) {
  var cx = canvas.width / 2;
  var cy = canvas.height / 2;
  var r  = cx - 4;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (var i = 0; i < N; i++) {
    var s     = SECTORS[i];
    var start = angle + i * ARC - Math.PI / 2;
    var end   = start + ARC;

    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath();
    ctx.fillStyle = s.color; ctx.fill();
    ctx.strokeStyle = 'rgba(26,26,26,0.6)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + ARC / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = s.color === '#E2001A' ? '#FFFFFF' : '#1A1A1A';
    ctx.font = 'bold 16px "Barlow Condensed", "Arial Narrow", sans-serif';
    var lines = s.label.split('\n');
    lines.forEach(function(line, li) {
      ctx.fillText(line.toUpperCase(), r - 12, (li - (lines.length - 1) / 2) * 15 + 5);
    });
    ctx.restore();
  }

  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3; ctx.stroke();
}

drawWheel(0);

// ── SPIN ─────────────────────────────────────────────────────────────────────
// Gira la ruleta cap a `prizeToShow` i crida onDone(prizeShown) en acabar.
// onDone rep el premi que s'ha mostrat — NO el serverPrize futur.
function runSpin(prizeToShow, onDone) {
  if (spinning) return;
  spinning = true;
  document.getElementById('btn-spin').disabled = true;

  var sectorId   = PRIZE_TO_SECTOR[prizeToShow] || 'better_luck';
  var candidates = [];
  SECTORS.forEach(function(s, i) { if (s.id === sectorId) candidates.push(i); });
  var targetIdx  = candidates[Math.floor(Math.random() * candidates.length)];

  var extraRot   = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
  var targetAng  = -(targetIdx * ARC + ARC / 2) + Math.PI / 2;
  var finalAngle = spinAngle - (spinAngle % (2 * Math.PI)) + extraRot + targetAng;
  var startAngle = spinAngle;
  var startTs    = null;
  var DURATION   = 5000;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(ts) {
    if (!startTs) startTs = ts;
    var p = Math.min((ts - startTs) / DURATION, 1);
    spinAngle = startAngle + (finalAngle - startAngle) * easeOut(p);
    drawWheel(spinAngle);
    if (p < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      onDone(prizeToShow);  // <-- sempre el premi que S'HA MOSTRAT, no el futur
    }
  }
  requestAnimationFrame(frame);
}

// ── BOTÓ GIRAR ───────────────────────────────────────────────────────────────
function spinWheel() {
  if (spinning) return;
  document.getElementById('try-again-toast').classList.remove('visible');

  // Capturem el premi d'aquesta tirada ABANS de girar
  var thisSpin = serverPrize;

  runSpin(thisSpin, function(prizeShown) {
    // prizeShown === thisSpin sempre (és el que hem passat a runSpin)
    if (prizeShown === 'Try Again') {
      // Mostrem toast
      document.getElementById('try-again-toast').classList.add('visible');
      // Ara sí: actualitzem serverPrize per a la PROPERA tirada (mai Try Again)
      serverPrize = pickFrom(FINAL_POOL);
      setTimeout(function() {
        document.getElementById('btn-spin').disabled = false;
      }, 1000);
    } else {
      showResult(prizeShown);
    }
  });
}

// ── RESULTAT ─────────────────────────────────────────────────────────────────
function showResult(prize) {
  var info = PRIZE_INFO[prize] || PRIZE_INFO['Better Luck Next Time!'];
  if (!PRIZE_INFO[prize]) prize = 'Better Luck Next Time!';

  document.getElementById('result-icon').innerHTML      = info.icon;
  document.getElementById('result-icon').className      = 'result-icon ' + (info.win ? 'win' : 'loss');
  document.getElementById('result-eyebrow').textContent = info.eyebrow;
  document.getElementById('result-title').innerHTML     = info.title;
  document.getElementById('result-body').textContent    = info.body;
  document.getElementById('result-note').textContent    = info.note;

  if (info.win) {
    document.getElementById('result-prize-box').style.display = 'block';
    document.getElementById('result-prize-name').textContent  = prize;
  } else {
    document.getElementById('result-prize-box').style.display = 'none';
  }
  showScreen('screen-result');
}

// ── FORMULARI ────────────────────────────────────────────────────────────────
function submitForm() {
  var nombre    = document.getElementById('nombre').value.trim();
  var apellidos = document.getElementById('apellidos').value.trim();
  var email     = document.getElementById('email').value.trim();
  var ciudad    = document.getElementById('ciudad').value.trim();
  var lopd      = document.getElementById('lopd').checked;

  document.getElementById('error-msg').style.display = 'none';

  if (!nombre || !apellidos || !email || !ciudad) { showError('Por favor, rellena todos los campos.'); return; }
  if (!isValidEmail(email))                        { showError('Introduce un email válido.'); return; }
  if (!lopd)                                       { showError('Debes aceptar la política de privacidad para participar.'); return; }

  userData = { nombre: nombre, apellidos: apellidos, email: email, ciudad: ciudad };

  var btnEl  = document.getElementById('btn-form');
  var loadEl = document.getElementById('loading');
  btnEl.disabled = true;
  loadEl.querySelector('.loading-text').textContent = 'Comprobando participación…';
  loadEl.classList.add('active');

  var settled = false;

  function proceed(prize) {
    if (settled) return;
    settled = true;
    clearTimeout(fallbackTimer);
    loadEl.classList.remove('active');
    btnEl.disabled = false;
    serverPrize = prize;
    showScreen('screen-wheel');
  }

  var fallbackTimer = setTimeout(function() {
    console.warn('Timeout — local prize');
    proceed(pickFrom(FULL_POOL));
  }, 8000);

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'check', email: email, nombre: nombre, apellidos: apellidos, ciudad: ciudad })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.alreadyPlayed) {
      settled = true;
      clearTimeout(fallbackTimer);
      loadEl.classList.remove('active');
      btnEl.disabled = false;
      showError('Ya has participado anteriormente con este email.');
      return;
    }
    proceed(data.prize || pickFrom(FULL_POOL));
  })
  .catch(function(err) {
    console.warn('Fetch error — local prize:', err);
    proceed(pickFrom(FULL_POOL));
  });
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function pickFrom(pool) { return pool[Math.floor(Math.random() * pool.length)]; }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

</script>
