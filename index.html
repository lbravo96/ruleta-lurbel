<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Lurbel × Like Sport</title>
<style>
@font-face{font-family:'Futura Std';src:url('./fonts/FuturaStd-Book.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Futura Std';src:url('./fonts/FuturaStd-Heavy.woff2') format('woff2');font-weight:700 800;font-style:normal;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E2001A;--reddark:#B3191A;--black:#1A1A1A;--grey:#D9D8D6;--mid:#C8C7C5;--white:#fff}
html,body{min-height:100%;font-family:'Futura Std',Arial,sans-serif;background:var(--black);color:var(--white);overflow-x:hidden}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(26,26,26,.96);border-bottom:1px solid rgba(255,255,255,.08)}
header img{height:24px}
.htag{font-family:'Futura Std',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}

/* SCREENS */
.screen{display:none;min-height:100vh;padding-top:56px}
.screen.active{display:flex;flex-direction:column}

/* === SCREEN 1: FORM === */
#s-form{position:relative;align-items:center;justify-content:center}
.hero-bg{position:fixed;inset:0;background:url('https://lurbel.eu/uploads/lurbel-spring-summer-26.jpg') center/cover no-repeat;z-index:0}
.hero-ov{position:fixed;inset:0;background:linear-gradient(135deg,rgba(26,26,26,.9) 0%,rgba(226,0,26,.15) 100%);z-index:1}
.fbox{position:relative;z-index:2;width:100%;max-width:460px;margin:32px 16px;background:rgba(26,26,26,.85);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);padding:36px 32px}
.feyebrow{font-family:'Futura Std',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.ftitle{font-family:'Futura Std',Arial,sans-serif;font-size:40px;font-weight:800;line-height:1;text-transform:uppercase;margin-bottom:6px}
.ftitle span{color:var(--red)}
.fsub{font-size:13px;color:var(--mid);line-height:1.5;margin-bottom:28px}
.frow{display:flex;gap:10px}
.fg{display:flex;flex-direction:column;flex:1;margin-bottom:14px}
.fg label{font-family:'Futura Std',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-bottom:5px}
.fg input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--white);font-family:'Futura Std',Arial,sans-serif;font-size:14px;padding:11px 13px;outline:none;transition:border-color .2s;width:100%}
.fg input:focus{border-color:var(--red)}
.fg input::placeholder{color:rgba(255,255,255,.25)}
.chk{display:flex;align-items:flex-start;gap:10px;margin-bottom:24px;cursor:pointer}
.chk input{width:17px;height:17px;min-width:17px;accent-color:var(--red);margin-top:2px;cursor:pointer}
.chk span{font-size:12px;color:var(--mid);line-height:1.5}
.chk a{color:var(--mid);text-decoration:underline}
.errmsg{display:none;background:rgba(226,0,26,.15);border:1px solid var(--red);color:#ff7070;font-size:13px;padding:11px 13px;margin-bottom:14px}
.btnred{width:100%;background:var(--red);color:var(--white);border:none;font-family:'Futura Std',Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;padding:15px 20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.btnred:hover{background:var(--reddark)}
.btnred:disabled{background:#555;cursor:not-allowed}

/* === SCREEN 2: WHEEL === */
#s-wheel{align-items:center;justify-content:center;background:var(--black);padding:32px 16px}
.wsection{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%;max-width:540px}
.whead{text-align:center}
.weyebrow{font-family:'Futura Std',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.whead h2{font-family:'Futura Std',Arial,sans-serif;font-size:30px;font-weight:800;text-transform:uppercase}
.toast{display:none;background:rgba(226,0,26,.12);border:1px solid rgba(226,0,26,.4);padding:12px 20px;text-align:center}
.toast.show{display:block}
.toast.error{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.toast p{font-family:'Futura Std',Arial,sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.toast span{color:var(--red)}
.wwrap{position:relative;width:460px;height:460px}
#wcanvas{border-radius:50%;box-shadow:0 0 0 5px var(--black),0 0 0 9px rgba(226,0,26,.35),0 20px 50px rgba(0,0,0,.7);display:block}
.wptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--red);filter:drop-shadow(0 2px 6px rgba(226,0,26,.8));z-index:10}
.wcap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;background:var(--black);border-radius:50%;border:3px solid rgba(255,255,255,.18);z-index:10;box-shadow:0 0 0 2px rgba(226,0,26,.25)}
.btnspin{background:var(--red);color:var(--white);border:none;font-family:'Futura Std',Arial,sans-serif;font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:17px 60px;cursor:pointer;transition:background .2s}
.btnspin:hover{background:var(--reddark)}
.btnspin:disabled{background:#444;cursor:not-allowed;opacity:.6}

/* === SCREEN 3: RESULT === */
#s-result{align-items:center;justify-content:center;background:var(--black);padding:80px 16px 40px}
.rcard{width:100%;max-width:440px;text-align:center}
.ricon{width:78px;height:78px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px}
.ricon.win{background:rgba(226,0,26,.15);border:2px solid var(--red)}
.ricon.loss{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15)}
.reyebrow{font-family:'Futura Std',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.rtitle{font-family:'Futura Std',Arial,sans-serif;font-size:42px;font-weight:800;text-transform:uppercase;line-height:1;margin-bottom:14px}
.rbody{font-size:14px;color:var(--mid);line-height:1.6;margin-bottom:28px;max-width:340px;margin-left:auto;margin-right:auto}
.rbox{background:rgba(226,0,26,.1);border:1px solid rgba(226,0,26,.3);padding:18px 22px;margin-bottom:28px}
.rbox .rlabel{font-family:'Futura Std',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--red);margin-bottom:5px}
.rbox .rname{font-family:'Futura Std',Arial,sans-serif;font-size:26px;font-weight:800;text-transform:uppercase}
.rnote{font-size:12px;color:rgba(255,255,255,.32);line-height:1.5}

/* LOADING */
.loadov{display:none;position:fixed;inset:0;background:rgba(26,26,26,.87);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.loadov.show{display:flex}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadtxt{font-family:'Futura Std',Arial,sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}

@media(max-width:520px){
  .fbox{padding:24px 18px;margin:20px 10px}
  .ftitle{font-size:30px}
  .frow{flex-direction:column;gap:0}
  .wwrap{width:310px;height:310px}
  #wcanvas{width:310px!important;height:310px!important}
  .wcap{width:40px;height:40px}
}
</style>
</head>
<body>

<div class="loadov" id="loadov">
  <div class="spinner"></div>
  <div class="loadtxt" id="loadtxt">Comprobando…</div>
</div>

<header>
  <img src="https://lurbel.eu/uploads/logo-lurbel-white.svg" alt="Lurbel" onerror="this.style.display='none'">
  <span class="htag">Lurbel × Like Sport</span>
</header>

<!-- SCREEN 1: FORM -->
<div class="screen active" id="s-form">
  <div class="hero-bg"></div>
  <div class="hero-ov"></div>
  <div class="fbox">
    <div class="feyebrow">Lurbel × Like Sport</div>
    <h1 class="ftitle">Gira la ruleta<br><span>y gana</span></h1>
    <p class="fsub">Rellena tus datos y prueba suerte. Hay premios Lurbel esperándote.</p>
    <div class="errmsg" id="errmsg"></div>
    <div class="frow">
      <div class="fg"><label>Nombre</label><input id="f-nombre" placeholder="Tu nombre" autocomplete="given-name"></div>
      <div class="fg"><label>Apellidos</label><input id="f-apellidos" placeholder="Tus apellidos" autocomplete="family-name"></div>
    </div>
    <div class="fg"><label>Email</label><input id="f-email" type="email" placeholder="tu@email.com" autocomplete="email"></div>
    <div class="fg"><label>Ciudad</label><input id="f-ciudad" placeholder="Tu ciudad" autocomplete="address-level2"></div>
    <label class="chk">
      <input type="checkbox" id="f-lopd">
      <span>He leído y acepto la <a href="https://lurbel.eu/politica-de-privacidad" target="_blank">política de privacidad</a> de MLS Textiles 1992 S.L. y consiento el tratamiento de mis datos personales para la gestión de esta promoción.</span>
    </label>
    <button class="btnred" id="btn-form" onclick="submitForm()">
      Girar la ruleta
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<!-- SCREEN 2: WHEEL -->
<div class="screen" id="s-wheel">
  <div class="wsection">
    <div class="whead">
      <div class="weyebrow">Tu turno</div>
      <h2>¡Gira y descubre tu premio!</h2>
    </div>
    <div class="toast" id="toast">
      <p>🔄 <span>¡Try Again!</span> Vuelve a girar</p>
    </div>
    <div class="wwrap">
      <div class="wptr"></div>
      <canvas id="wcanvas" width="460" height="460"></canvas>
      <div class="wcap" aria-hidden="true"></div>
    </div>
    <button class="btnspin" id="btn-spin" onclick="spinWheel()">¡Girar!</button>
  </div>
</div>

<!-- SCREEN 3: RESULT -->
<div class="screen" id="s-result">
  <div class="rcard">
    <div class="ricon" id="r-icon"></div>
    <div class="reyebrow" id="r-eyebrow"></div>
    <div class="rtitle" id="r-title"></div>
    <div class="rbody" id="r-body"></div>
    <div class="rbox" id="r-box" style="display:none">
      <div class="rlabel">Tu premio</div>
      <div class="rname" id="r-name"></div>
    </div>
    <div class="rnote" id="r-note"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   CONFIGURACIÓN
═══════════════════════════════════════════════════════ */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbznT0e67yG5W3-CVpEVh38vgk5XOK-ObChEhKYRgTMELwfWIRA-yH-85SXwbBDG1ZbYsw/exec';

/* Premios — deben coincidir exactamente con Code.gs */
var P_LURBEL   = 'Lurbel Pack';
var P_GIFT     = 'Gift';
var P_DISCOUNT = 'Discount Coupon';
var P_BETTER   = 'Better Luck Next Time!';
var P_TRY      = 'Try Again';

/* ═══════════════════════════════════════════════════════
   SECTORES — 12 casillas, en orden horario desde arriba.
   Diseño visual sin iconos.
   Nota: las probabilidades reales las decide Google Apps Script.
═══════════════════════════════════════════════════════ */
var RED  = '#E2001A';
var GREY = '#E9E9E9';
var SECTORS = [
  {t:P_BETTER,   c:RED,  label:'Better Luck\nNext Time!'},
  {t:P_DISCOUNT, c:GREY, label:'Discount\nCoupon'},
  {t:P_BETTER,   c:RED,  label:'Better Luck\nNext Time!'},
  {t:P_TRY,      c:GREY, label:'Try Again'},
  {t:P_BETTER,   c:RED,  label:'Better Luck\nNext Time!'},
  {t:P_GIFT,     c:GREY, label:'Gift'},
  {t:P_TRY,      c:RED,  label:'Try Again'},
  {t:P_BETTER,   c:GREY, label:'Better Luck\nNext Time!'},
  {t:P_TRY,      c:RED,  label:'Try Again'},
  {t:P_LURBEL,   c:GREY, label:'Lurbel Pack'},
  {t:P_BETTER,   c:RED,  label:'Better Luck\nNext Time!'},
  {t:P_TRY,      c:GREY, label:'Try Again'}
];

var KNOWN_PRIZES = [P_LURBEL, P_GIFT, P_DISCOUNT, P_BETTER, P_TRY];

/* Probabilidades reales en el servidor actualizado:
   Better Luck 30% · Try Again 24% · Discount Coupon 24% · Gift 14% · Lurbel Pack 8%
   Si se agota el límite diario de Lurbel Pack, su peso se excluye automáticamente. */

/* ═══════════════════════════════════════════════════════
   PANTALLA DE RESULTADO
═══════════════════════════════════════════════════════ */
var RESULTS = {};
RESULTS[P_LURBEL]   = {win:true,  icon:'🎉', ey:'¡Enhorabuena!',       ti:'¡Has ganado el<br>Lurbel Pack!',      bo:'¡El premio más especial de la ruleta! El equipo de Like Sport se pondrá en contacto contigo.', no:'Muestra esta pantalla en tienda.'};
RESULTS[P_GIFT]     = {win:true,  icon:'🎁', ey:'¡Enhorabuena!',       ti:'¡Has ganado un<br>regalo sorpresa!',  bo:'Pasa por el mostrador de Like Sport y recoge tu regalo Lurbel.',                              no:'Muestra esta pantalla en tienda.'};
RESULTS[P_DISCOUNT] = {win:true,  icon:'🎟', ey:'¡Enhorabuena!',       ti:'¡Has ganado un<br>cupón descuento!', bo:'Pasa por Like Sport y disfruta de tu descuento exclusivo en productos Lurbel.',               no:'Muestra esta pantalla en tienda.'};
RESULTS[P_BETTER]   = {win:false, icon:'😅', ey:'Sin suerte esta vez', ti:'Mejor suerte<br>la próxima',         bo:'¡Gracias por participar!',                                                                    no:''};

/* ═══════════════════════════════════════════════════════
   ESTADO GLOBAL
═══════════════════════════════════════════════════════ */
var spinning    = false;
var spinAngle   = 0;
var nextPrize   = null;
var userData    = {};

/* ═══════════════════════════════════════════════════════
   CANVAS
═══════════════════════════════════════════════════════ */
var canvas = document.getElementById('wcanvas');
var ctx    = canvas.getContext('2d');
var N      = SECTORS.length;
var ARC    = (2 * Math.PI) / N;

function drawWheel(a) {
  var cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 4;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (var i = 0; i < N; i++) {
    var s = SECTORS[i];
    var mid = a + i * ARC - Math.PI / 2; // sector 0 centrado arriba
    var s0 = mid - ARC / 2;
    var s1 = mid + ARC / 2;
    var ink = s.c === RED ? '#FFFFFF' : '#1A1A1A';

    // sector
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, s0, s1);
    ctx.closePath();
    ctx.fillStyle = s.c;
    ctx.fill();

    // separador fino, como la captura
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, s0, s1);
    ctx.closePath();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // texto rotado con el sector, sin iconos
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ink;
    ctx.font = '700 15px "Futura Std", Arial, sans-serif';
    var lines = s.label.split('\n');
    var lh = 15;
    var tx = r * 0.64;
    for (var l = 0; l < lines.length; l++) {
      var ty = -((lines.length - 1) * lh) / 2 + l * lh;
      ctx.fillText(lines[l].toUpperCase(), tx, ty);
    }
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2 * Math.PI);
  ctx.strokeStyle = '#F6F6F6';
  ctx.lineWidth = 3;
  ctx.stroke();
}

drawWheel(0);
if (document.fonts) {
  document.fonts.ready.then(function() { drawWheel(spinAngle); });
}

/* ═══════════════════════════════════════════════════════
   ANIMACIÓN
═══════════════════════════════════════════════════════ */
function animate(prizeName, onEnd) {
  var candidates = [];
  for (var i = 0; i < N; i++) {
    if (SECTORS[i].t === prizeName) candidates.push(i);
  }
  if (!candidates.length) {
    showToast('No hemos podido validar el premio. Inténtalo de nuevo.', true);
    document.getElementById('btn-spin').disabled = false;
    return;
  }

  var idx = candidates[Math.floor(Math.random() * candidates.length)];

  // Con drawWheel(), el centro del sector idx está en: spinAngle + idx*ARC - PI/2.
  // Para que quede bajo el puntero superior (-PI/2), spinAngle debe ser -idx*ARC.
  // Añadimos un pequeño desplazamiento controlado para que no caiga siempre al centro.
  var jitter = (Math.random() - 0.5) * ARC * 0.45;
  var targetAng = -idx * ARC + jitter;

  var fullTurns = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
  var curNorm = normalizeAngle(spinAngle);
  var tarNorm = normalizeAngle(targetAng);
  var delta = tarNorm - curNorm;
  if (delta < 0) delta += 2 * Math.PI;

  var finalAngle = spinAngle + fullTurns + delta;
  var t0 = null;
  var DUR = 5000;
  var from = spinAngle;

  function ease(x) { return 1 - Math.pow(1 - x, 4); }

  spinning = true;
  document.getElementById('btn-spin').disabled = true;

  function frame(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / DUR, 1);
    spinAngle = from + (finalAngle - from) * ease(p);
    drawWheel(spinAngle);
    if (p < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      onEnd(prizeName);
    }
  }
  requestAnimationFrame(frame);
}

/* ═══════════════════════════════════════════════════════
   BOTÓN GIRAR
═══════════════════════════════════════════════════════ */
function spinWheel() {
  if (spinning) return;
  clearToast();

  if (!nextPrize || !isKnownPrize(nextPrize)) {
    showToast('No hay premio validado. Vuelve a enviar el formulario.', true);
    return;
  }

  var thisPrize = nextPrize;
  nextPrize = null;

  animate(thisPrize, function(shown) {
    if (shown === P_TRY) {
      showToast('🔄 ¡Try Again! Preparando tu segundo intento…', false);
      prepareServerRespin();
    } else {
      showResult(shown);
    }
  });
}

function prepareServerRespin() {
  var btn = document.getElementById('btn-spin');
  btn.disabled = true;

  postToServer({ action:'respin', email:userData.email }, 10000)
    .then(function(data) {
      if (!data || !data.ok) {
        throw new Error((data && data.error) || 'Error de servidor');
      }
      var p = normalizePrize(data.prize);
      if (!isKnownPrize(p) || p === P_TRY) {
        throw new Error('Premio de segundo intento no válido');
      }
      nextPrize = p;
      showToast('🔄 ¡Try Again! Vuelve a girar.', false);
      setTimeout(function() { btn.disabled = false; }, 700);
    })
    .catch(function(err) {
      nextPrize = null;
      showToast('No hemos podido preparar el segundo intento. Revisa la conexión y vuelve a intentarlo.', true);
      btn.disabled = false;
    });
}

/* ═══════════════════════════════════════════════════════
   RESULTADO
═══════════════════════════════════════════════════════ */
function showResult(prize) {
  var r = RESULTS[prize];
  if (!r) { r = RESULTS[P_BETTER]; prize = P_BETTER; }

  document.getElementById('r-icon').textContent    = r.icon;
  document.getElementById('r-icon').className      = 'ricon ' + (r.win ? 'win' : 'loss');
  document.getElementById('r-eyebrow').textContent = r.ey;
  document.getElementById('r-title').innerHTML     = r.ti;
  document.getElementById('r-body').textContent    = r.bo;
  document.getElementById('r-note').textContent    = r.no;
  if (r.win) {
    document.getElementById('r-box').style.display = 'block';
    document.getElementById('r-name').textContent  = prize;
  } else {
    document.getElementById('r-box').style.display = 'none';
  }
  showScreen('s-result');
}

/* ═══════════════════════════════════════════════════════
   FORMULARIO
═══════════════════════════════════════════════════════ */
function submitForm() {
  var nombre    = document.getElementById('f-nombre').value.trim();
  var apellidos = document.getElementById('f-apellidos').value.trim();
  var email     = document.getElementById('f-email').value.trim().toLowerCase();
  var ciudad    = document.getElementById('f-ciudad').value.trim();
  var lopd      = document.getElementById('f-lopd').checked;

  document.getElementById('errmsg').style.display = 'none';

  if (!nombre || !apellidos || !email || !ciudad) { showErr('Por favor, rellena todos los campos.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Introduce un email válido.'); return; }
  if (!lopd) { showErr('Debes aceptar la política de privacidad para participar.'); return; }

  userData = {nombre:nombre, apellidos:apellidos, email:email, ciudad:ciudad};

  var btn = document.getElementById('btn-form');
  btn.disabled = true;
  showLoad('Comprobando participación…');

  postToServer({
    action:'check',
    email: email,
    nombre: nombre,
    apellidos: apellidos,
    ciudad: ciudad
  }, 10000)
  .then(function(data) {
    hideLoad();
    btn.disabled = false;

    if (!data || !data.ok) {
      showErr((data && data.error) || 'No hemos podido validar la participación. Inténtalo de nuevo.');
      return;
    }
    if (data.alreadyPlayed) {
      showErr('Ya has participado anteriormente con este email.');
      return;
    }

    var p = normalizePrize(data.prize);
    if (!isKnownPrize(p)) {
      showErr('El servidor ha devuelto un premio no válido. Revisa la configuración.');
      return;
    }

    nextPrize = p;
    showScreen('s-wheel');
  })
  .catch(function() {
    hideLoad();
    btn.disabled = false;
    showErr('No hemos podido conectar con el servidor. Inténtalo de nuevo en unos segundos.');
  });
}

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
function postToServer(payload, timeoutMs) {
  var controller = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function() {
    if (controller) controller.abort();
  }, timeoutMs || 10000);

  var opts = {
    method:'POST',
    body: JSON.stringify(payload)
    // No añadimos Content-Type: application/json para evitar preflight CORS innecesario en Apps Script.
  };
  if (controller) opts.signal = controller.signal;

  return fetch(GAS_URL, opts)
    .then(function(res) { return res.json(); })
    .then(function(data) { clearTimeout(timer); return data; })
    .catch(function(err) { clearTimeout(timer); throw err; });
}

function normalizePrize(value) {
  var v = String(value || '').trim().toLowerCase();
  for (var i = 0; i < KNOWN_PRIZES.length; i++) {
    if (KNOWN_PRIZES[i].toLowerCase() === v) return KNOWN_PRIZES[i];
  }
  return '';
}
function isKnownPrize(value) {
  return KNOWN_PRIZES.indexOf(value) !== -1;
}
function normalizeAngle(a) {
  return ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function showErr(msg) {
  var el = document.getElementById('errmsg');
  el.textContent = msg;
  el.style.display = 'block';
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function showLoad(txt) {
  document.getElementById('loadtxt').textContent = txt;
  document.getElementById('loadov').classList.add('show');
}
function hideLoad() {
  document.getElementById('loadov').classList.remove('show');
}
function showToast(msg, isError) {
  var el = document.getElementById('toast');
  el.classList.toggle('error', !!isError);
  el.innerHTML = '<p>' + msg + '</p>';
  el.classList.add('show');
}
function clearToast() {
  var el = document.getElementById('toast');
  el.classList.remove('show');
  el.classList.remove('error');
}
</script>
