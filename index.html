<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Lurbel × Like Sport</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E2001A;--reddark:#B3191A;--black:#1A1A1A;--grey:#D9D8D6;--mid:#C8C7C5;--white:#fff}
html,body{min-height:100%;font-family:'Barlow',sans-serif;background:var(--black);color:var(--white);overflow-x:hidden}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(26,26,26,.96);border-bottom:1px solid rgba(255,255,255,.08)}
header img{height:24px}
.htag{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}

/* SCREENS */
.screen{display:none;min-height:100vh;padding-top:56px}
.screen.active{display:flex;flex-direction:column}

/* === SCREEN 1: FORM === */
#s-form{position:relative;align-items:center;justify-content:center}
.hero-bg{position:fixed;inset:0;background:url('https://lurbel.eu/uploads/lurbel-spring-summer-26.jpg') center/cover no-repeat;z-index:0}
.hero-ov{position:fixed;inset:0;background:linear-gradient(135deg,rgba(26,26,26,.9) 0%,rgba(226,0,26,.15) 100%);z-index:1}
.fbox{position:relative;z-index:2;width:100%;max-width:460px;margin:32px 16px;background:rgba(26,26,26,.85);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);padding:36px 32px}
.feyebrow{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.ftitle{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:800;line-height:1;text-transform:uppercase;margin-bottom:6px}
.ftitle span{color:var(--red)}
.fsub{font-size:13px;color:var(--mid);line-height:1.5;margin-bottom:28px}
.frow{display:flex;gap:10px}
.fg{display:flex;flex-direction:column;flex:1;margin-bottom:14px}
.fg label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-bottom:5px}
.fg input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--white);font-family:'Barlow',sans-serif;font-size:14px;padding:11px 13px;outline:none;transition:border-color .2s;width:100%}
.fg input:focus{border-color:var(--red)}
.fg input::placeholder{color:rgba(255,255,255,.25)}
.chk{display:flex;align-items:flex-start;gap:10px;margin-bottom:24px;cursor:pointer}
.chk input{width:17px;height:17px;min-width:17px;accent-color:var(--red);margin-top:2px;cursor:pointer}
.chk span{font-size:12px;color:var(--mid);line-height:1.5}
.chk a{color:var(--mid);text-decoration:underline}
.errmsg{display:none;background:rgba(226,0,26,.15);border:1px solid var(--red);color:#ff7070;font-size:13px;padding:11px 13px;margin-bottom:14px}
.btnred{width:100%;background:var(--red);color:var(--white);border:none;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;padding:15px 20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.btnred:hover{background:var(--reddark)}
.btnred:disabled{background:#555;cursor:not-allowed}

/* === SCREEN 2: WHEEL === */
#s-wheel{align-items:center;justify-content:center;background:var(--black);padding:32px 16px}
.wsection{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%;max-width:540px}
.whead{text-align:center}
.weyebrow{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.whead h2{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;text-transform:uppercase}
.toast{display:none;background:rgba(226,0,26,.12);border:1px solid rgba(226,0,26,.4);padding:12px 20px;text-align:center}
.toast.show{display:block}
.toast p{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.toast span{color:var(--red)}
.wwrap{position:relative;width:460px;height:460px}
#wcanvas{border-radius:50%;box-shadow:0 0 0 5px var(--black),0 0 0 9px rgba(226,0,26,.35),0 20px 50px rgba(0,0,0,.7);display:block}
.wptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--red);filter:drop-shadow(0 2px 6px rgba(226,0,26,.8));z-index:10}
.wcap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;background:var(--black);border-radius:50%;border:3px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;z-index:10;box-shadow:0 0 0 2px rgba(226,0,26,.25)}
.wcap svg{width:32px;height:32px}
.btnspin{background:var(--red);color:var(--white);border:none;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:17px 60px;cursor:pointer;transition:background .2s}
.btnspin:hover{background:var(--reddark)}
.btnspin:disabled{background:#444;cursor:not-allowed;opacity:.6}

/* === SCREEN 3: RESULT === */
#s-result{align-items:center;justify-content:center;background:var(--black);padding:80px 16px 40px}
.rcard{width:100%;max-width:440px;text-align:center}
.ricon{width:78px;height:78px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px}
.ricon.win{background:rgba(226,0,26,.15);border:2px solid var(--red)}
.ricon.loss{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15)}
.reyebrow{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.rtitle{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:800;text-transform:uppercase;line-height:1;margin-bottom:14px}
.rbody{font-size:14px;color:var(--mid);line-height:1.6;margin-bottom:28px;max-width:340px;margin-left:auto;margin-right:auto}
.rbox{background:rgba(226,0,26,.1);border:1px solid rgba(226,0,26,.3);padding:18px 22px;margin-bottom:28px}
.rbox .rlabel{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--red);margin-bottom:5px}
.rbox .rname{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;text-transform:uppercase}
.rnote{font-size:12px;color:rgba(255,255,255,.32);line-height:1.5}

/* LOADING */
.loadov{display:none;position:fixed;inset:0;background:rgba(26,26,26,.87);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.loadov.show{display:flex}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadtxt{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}

@media(max-width:520px){
  .fbox{padding:24px 18px;margin:20px 10px}
  .ftitle{font-size:30px}
  .frow{flex-direction:column;gap:0}
  .wwrap{width:310px;height:310px}
  #wcanvas{width:310px!important;height:310px!important}
  .wcap{width:42px;height:42px}
  .wcap svg{width:22px;height:22px}
}
</style>
</head>
<body>

<div class="loadov" id="loadov">
  <div class="spinner"></div>
  <div class="loadtxt" id="loadtxt">Comprobando…</div>
</div>

<header>
  <img src="https://lurbel.eu/uploads/logo-lurbel-white.svg" alt="Lurbel" onerror="this.style.display='none'">
  <span class="htag">Lurbel × Like Sport</span>
</header>

<!-- SCREEN 1: FORM -->
<div class="screen active" id="s-form">
  <div class="hero-bg"></div>
  <div class="hero-ov"></div>
  <div class="fbox">
    <div class="feyebrow">Lurbel × Like Sport</div>
    <h1 class="ftitle">Gira la ruleta<br><span>y gana</span></h1>
    <p class="fsub">Rellena tus datos y prueba suerte. Hay premios Lurbel esperándote.</p>
    <div class="errmsg" id="errmsg"></div>
    <div class="frow">
      <div class="fg"><label>Nombre</label><input id="f-nombre" placeholder="Tu nombre" autocomplete="given-name"></div>
      <div class="fg"><label>Apellidos</label><input id="f-apellidos" placeholder="Tus apellidos" autocomplete="family-name"></div>
    </div>
    <div class="fg"><label>Email</label><input id="f-email" type="email" placeholder="tu@email.com" autocomplete="email"></div>
    <div class="fg"><label>Ciudad</label><input id="f-ciudad" placeholder="Tu ciudad" autocomplete="address-level2"></div>
    <label class="chk">
      <input type="checkbox" id="f-lopd">
      <span>He leído y acepto la <a href="https://lurbel.eu/politica-de-privacidad" target="_blank">política de privacidad</a> de MLS Textiles 1992 S.L. y consiento el tratamiento de mis datos personales para la gestión de esta promoción.</span>
    </label>
    <button class="btnred" id="btn-form" onclick="submitForm()">
      Girar la ruleta
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<!-- SCREEN 2: WHEEL -->
<div class="screen" id="s-wheel">
  <div class="wsection">
    <div class="whead">
      <div class="weyebrow">Tu turno</div>
      <h2>¡Gira y descubre tu premio!</h2>
    </div>
    <div class="toast" id="toast">
      <p>🔄 <span>¡Try Again!</span> Vuelve a girar</p>
    </div>
    <div class="wwrap">
      <div class="wptr"></div>
      <canvas id="wcanvas" width="460" height="460"></canvas>
      <div class="wcap">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="47" cy="64" rx="28" ry="30" fill="none" stroke="white" stroke-width="9"/>
          <path d="M47 34 C47 34 62 20 80 28 C95 35 100 52 95 66 C91 77 82 84 82 84" fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>
          <path d="M75 78 C75 78 90 70 98 55" fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <button class="btnspin" id="btn-spin" onclick="spinWheel()">¡Girar!</button>
  </div>
</div>

<!-- SCREEN 3: RESULT -->
<div class="screen" id="s-result">
  <div class="rcard">
    <div class="ricon" id="r-icon"></div>
    <div class="reyebrow" id="r-eyebrow"></div>
    <div class="rtitle" id="r-title"></div>
    <div class="rbody" id="r-body"></div>
    <div class="rbox" id="r-box" style="display:none">
      <div class="rlabel">Tu premio</div>
      <div class="rname" id="r-name"></div>
    </div>
    <div class="rnote" id="r-note"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   CONFIGURACIÓ
═══════════════════════════════════════════════════════ */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxWc6mZtAgUN2hDMcxBQ4UEfPQxCVAbwehH8gWocs_RU75p8Qi8NhBeE7vW9J7dPeoFfg/exec';

/* ═══════════════════════════════════════════════════════
   PREMIS — strings exactes, mai canviar
═══════════════════════════════════════════════════════ */
var P_LURBEL   = 'Lurbel Pack';
var P_GIFT     = 'Gift';
var P_DISCOUNT = 'Discount Coupon';
var P_BETTER   = 'Better Luck Next Time!';
var P_TRY      = 'Try Again';

/* Pool inicial (el servidor pot retornar qualsevol) */
var POOL_FULL = [
  P_BETTER, P_BETTER, P_BETTER, P_BETTER,
  P_TRY, P_TRY, P_TRY, P_TRY,
  P_DISCOUNT, P_GIFT, P_LURBEL
];

/* Pool Try Again: mai retorna Try Again per evitar bucles infinits */
var POOL_RETRY = [
  P_BETTER, P_BETTER, P_BETTER, P_BETTER,
  P_DISCOUNT, P_GIFT, P_LURBEL
];

/* ═══════════════════════════════════════════════════════
   SECTORS — 11 caselles
   4× Better Luck + 4× Try Again + 1× Discount + 1× Gift + 1× Lurbel Pack
═══════════════════════════════════════════════════════ */
var SECTORS = [
  {t: P_BETTER,   c:'#E2001A', label:'Better Luck\nNext Time!'},
  {t: P_TRY,      c:'#D9D8D6', label:'Try Again'},
  {t: P_BETTER,   c:'#E2001A', label:'Better Luck\nNext Time!'},
  {t: P_DISCOUNT, c:'#D9D8D6', label:'Discount\nCoupon'},
  {t: P_BETTER,   c:'#E2001A', label:'Better Luck\nNext Time!'},
  {t: P_TRY,      c:'#D9D8D6', label:'Try Again'},
  {t: P_LURBEL,   c:'#E2001A', label:'Lurbel Pack'},
  {t: P_TRY,      c:'#D9D8D6', label:'Try Again'},
  {t: P_BETTER,   c:'#E2001A', label:'Better Luck\nNext Time!'},
  {t: P_GIFT,     c:'#D9D8D6', label:'Gift'},
  {t: P_TRY,      c:'#E2001A', label:'Try Again'},
];

/* ═══════════════════════════════════════════════════════
   PANTALLA DE RESULTAT — per premi
═══════════════════════════════════════════════════════ */
var RESULTS = {};
RESULTS[P_LURBEL]   = {win:true,  icon:'🎉', ey:'¡Enhorabuena!',       ti:'¡Has ganado el<br>Lurbel Pack!',       bo:'¡El premio más especial de la ruleta! El equipo de Like Sport se pondrá en contacto contigo.', no:'Muestra esta pantalla en tienda.'};
RESULTS[P_GIFT]     = {win:true,  icon:'🎁', ey:'¡Enhorabuena!',       ti:'¡Has ganado un<br>regalo sorpresa!',   bo:'Pasa por el mostrador de Like Sport y recoge tu regalo Lurbel.',                              no:'Muestra esta pantalla en tienda.'};
RESULTS[P_DISCOUNT] = {win:true,  icon:'🎟', ey:'¡Enhorabuena!',       ti:'¡Has ganado un<br>cupón descuento!',  bo:'Pasa por Like Sport y disfruta de tu descuento exclusivo en productos Lurbel.',               no:'Muestra esta pantalla en tienda.'};
RESULTS[P_BETTER]   = {win:false, icon:'😅', ey:'Sin suerte esta vez', ti:'Mejor suerte<br>la próxima',          bo:'¡Gracias por participar!',                                                                     no:''};

/* ═══════════════════════════════════════════════════════
   ESTAT GLOBAL
═══════════════════════════════════════════════════════ */
var spinning    = false;
var spinAngle   = 0;
var nextPrize   = null;   /* premi que ha de mostrar la PROPERA tirada */
var userData    = {};

/* ═══════════════════════════════════════════════════════
   CANVAS
═══════════════════════════════════════════════════════ */
var canvas = document.getElementById('wcanvas');
var ctx    = canvas.getContext('2d');
var N      = SECTORS.length;
var ARC    = (2 * Math.PI) / N;

function drawWheel(a) {
  var cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 4;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (var i = 0; i < N; i++) {
    var s = SECTORS[i];
    var s0 = a + i * ARC - Math.PI / 2;
    var s1 = s0 + ARC;
    /* fill */
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s0,s1); ctx.closePath();
    ctx.fillStyle = s.c; ctx.fill();
    /* border */
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s0,s1); ctx.closePath();
    ctx.strokeStyle = 'rgba(26,26,26,0.65)'; ctx.lineWidth = 2; ctx.stroke();
    /* text */
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s0 + ARC / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = s.c === '#E2001A' ? '#fff' : '#1a1a1a';
    ctx.font = 'bold 15px "Barlow Condensed","Arial Narrow",Arial,sans-serif';
    var lines = s.label.split('\n');
    var lh = 14;
    for (var l = 0; l < lines.length; l++) {
      var yo = (l - (lines.length - 1) / 2) * lh + 4;
      ctx.fillText(lines[l].toUpperCase(), r - 12, yo);
    }
    ctx.restore();
  }
  /* outer ring */
  ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 3; ctx.stroke();
}
drawWheel(0);

/* ═══════════════════════════════════════════════════════
   ANIMACIÓ
   prizeName: string exacte del premi que ha d'apuntar el punter
   onEnd(prizeName): crida quan l'animació acaba
═══════════════════════════════════════════════════════ */
function animate(prizeName, onEnd) {
  /* Troba tots els sectors que corresponen a aquest premi */
  var candidates = [];
  for (var i = 0; i < N; i++) {
    if (SECTORS[i].t === prizeName) candidates.push(i);
  }
  if (candidates.length === 0) candidates = [0]; /* fallback segur */
  var idx = candidates[Math.floor(Math.random() * candidates.length)];

  /* Angle objectiu: centre del sector idx ha d'alinear-se amb el punter (dalt = -π/2) */
  var targetAng = -(idx * ARC + ARC / 2) + Math.PI / 2;
  /* Afegim voltes senceres per fer l'animació realista */
  var fullTurns = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
  /* Normalitzem l'angle actual a [0, 2π) per calcular bé la distància */
  var curNorm = ((spinAngle % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  var tarNorm = ((targetAng % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  var delta   = tarNorm - curNorm;
  if (delta < 0) delta += 2*Math.PI;
  var finalAngle = spinAngle + fullTurns + delta;

  var t0   = null;
  var DUR  = 5000;
  var from = spinAngle;

  function ease(x) { return 1 - Math.pow(1 - x, 4); }

  spinning = true;
  document.getElementById('btn-spin').disabled = true;

  function frame(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / DUR, 1);
    spinAngle = from + (finalAngle - from) * ease(p);
    drawWheel(spinAngle);
    if (p < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      onEnd(prizeName); /* retornem el premi que hem mostrat */
    }
  }
  requestAnimationFrame(frame);
}

/* ═══════════════════════════════════════════════════════
   BOTÓ GIRAR
═══════════════════════════════════════════════════════ */
function spinWheel() {
  if (spinning) return;

  /* Amaguem toast anterior */
  document.getElementById('toast').classList.remove('show');

  /* El premi d'AQUESTA tirada és nextPrize (assignat pel servidor o local) */
  var thisPrize = nextPrize;

  animate(thisPrize, function(shown) {
    /* shown === thisPrize sempre */
    if (shown === P_TRY) {
      /* Try Again: mostrem toast i preparem NOU premi per a la propera tirada */
      document.getElementById('toast').classList.add('show');
      /* Nou premi de la pool RETRY (mai Try Again) */
      nextPrize = randFrom(POOL_RETRY);
      /* Habilitem botó després d'1 segon */
      setTimeout(function() {
        document.getElementById('btn-spin').disabled = false;
      }, 1000);
    } else {
      /* Premi definitiu → mostra resultat */
      showResult(shown);
    }
  });
}

/* ═══════════════════════════════════════════════════════
   RESULTAT
═══════════════════════════════════════════════════════ */
function showResult(prize) {
  var r = RESULTS[prize];
  if (!r) { r = RESULTS[P_BETTER]; prize = P_BETTER; } /* mai hauria de passar */

  document.getElementById('r-icon').textContent    = r.icon;
  document.getElementById('r-icon').className      = 'ricon ' + (r.win ? 'win' : 'loss');
  document.getElementById('r-eyebrow').textContent = r.ey;
  document.getElementById('r-title').innerHTML     = r.ti;
  document.getElementById('r-body').textContent    = r.bo;
  document.getElementById('r-note').textContent    = r.no;
  if (r.win) {
    document.getElementById('r-box').style.display = 'block';
    document.getElementById('r-name').textContent  = prize;
  } else {
    document.getElementById('r-box').style.display = 'none';
  }
  showScreen('s-result');
}

/* ═══════════════════════════════════════════════════════
   FORMULARI
═══════════════════════════════════════════════════════ */
function submitForm() {
  var nombre    = document.getElementById('f-nombre').value.trim();
  var apellidos = document.getElementById('f-apellidos').value.trim();
  var email     = document.getElementById('f-email').value.trim();
  var ciudad    = document.getElementById('f-ciudad').value.trim();
  var lopd      = document.getElementById('f-lopd').checked;

  document.getElementById('errmsg').style.display = 'none';

  if (!nombre || !apellidos || !email || !ciudad) { showErr('Por favor, rellena todos los campos.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Introduce un email válido.'); return; }
  if (!lopd) { showErr('Debes aceptar la política de privacidad para participar.'); return; }

  userData = {nombre:nombre, apellidos:apellidos, email:email, ciudad:ciudad};

  var btn = document.getElementById('btn-form');
  btn.disabled = true;
  showLoad('Comprobando participación…');

  /* Fem el fetch amb timeout de 8s.
     Si el servidor respon → usem el seu premi.
     Si falla o tarda massa → assignem premi local.
     En ambdós casos passem a la pantalla de la ruleta. */
  var done = false;

  var timer = setTimeout(function() {
    if (done) return;
    done = true;
    hideLoad();
    btn.disabled = false;
    nextPrize = randFrom(POOL_FULL);
    showScreen('s-wheel');
  }, 8000);

  fetch(GAS_URL, {
    method:'POST',
    body: JSON.stringify({
      action:'check',
      email: email,
      nombre: nombre,
      apellidos: apellidos,
      ciudad: ciudad
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    hideLoad();
    btn.disabled = false;

    if (data.alreadyPlayed) {
      showErr('Ya has participado anteriormente con este email.');
      return;
    }
    /* El servidor retorna data.prize — validem que sigui un premi conegut */
    var p = data.prize;
    if (p !== P_LURBEL && p !== P_GIFT && p !== P_DISCOUNT && p !== P_BETTER && p !== P_TRY) {
      p = randFrom(POOL_FULL); /* premi desconegut → local */
    }
    nextPrize = p;
    showScreen('s-wheel');
  })
  .catch(function() {
    if (done) return;
    done = true;
    clearTimeout(timer);
    hideLoad();
    btn.disabled = false;
    nextPrize = randFrom(POOL_FULL);
    showScreen('s-wheel');
  });
}

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
function randFrom(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function showErr(msg) {
  var el = document.getElementById('errmsg');
  el.textContent = msg; el.style.display = 'block';
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function showLoad(txt) {
  document.getElementById('loadtxt').textContent = txt;
  document.getElementById('loadov').classList.add('show');
}
function hideLoad() {
  document.getElementById('loadov').classList.remove('show');
}
</script>
</body>
</html>
